<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Login</title>
</head>

<body>
    <header>
        <div class="div-logo">
            <img src="../assets/logo.svg" alt="Logo">
        </div>
        <h1 class="logo-font-g">Linketinder</h1>
    </header>
    <main>
        <section class="login-card">
            <div class="title-container">
                <h2 class="title-font">Acesse sua conta</h2>
                <p class="description-m">Conecte-se às melhores oportunidades.</p>
            </div>

            <form action="">
                <div class="input-group">
                    <label for="user" class="label-font-s">Usuário</label>
                    <div class="input-wrapper">
                        <img src="../assets/mail.svg" alt="Email icon" class="input-icon">
                        <input type="email" id="user" name="user" placeholder="Digite seu usuário">
                    </div>
                </div>
                <div class="input-group">
                    <div class="label-row">
                        <label for="password" class="label-font-s">Senha</label>
                        <a href="#" class="forgot-password location-font">Esqueci minha senha</a>
                    </div>
                    <div class="input-wrapper">
                        <img src="../assets/lock.svg" alt="Lock icon" class="input-icon">
                        <input type="password" id="password" name="password" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="submit-btn">
                    <p class="label-font-m">Entrar</p>
                    <img src="../assets/right-arrow-white.svg" alt="Seta para a direita">
                </button>
                
                <div class="register-link description-sm">
                    Ainda não tem conta? <a href="#" class="location-font" style="font-weight: 600;">Criar uma conta</a>
                </div>
            </form>
        </section>
    </main>
    <footer>
        <p class="footer-font">&copy; 2026 Linketinder. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
